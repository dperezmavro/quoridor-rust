[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "cargo-fmt",
        name = "cargo fmt",
        language = "system",
        entry = "cargo fmt --",
        types = ["rust"],
        pass_filenames = false,
    },
    {
        id = "check-todo",
        name = "Check for TODO comments",
        # grep exits 0 on a match and 1 on none; the hook must fail on a match, so invert it.
        entry = "sh -c '! grep -nEI \"(//\\s*TODO|todo!\\()\" \"$@\"' --",
        language = "system",
        files = "\\.rs$",
        stages = ["pre-commit"]
    },
    {
        id = "check-clippy",
        name = "cargo clippy",
        # Fails on any rustc or clippy warning, so CI and local commits stay warning-free.
        entry = "cargo clippy --all-targets -- -D warnings",
        language = "system",
        types = ["rust"],
        # Clippy checks the whole crate; file names appended by prek would be passed to rustc.
        pass_filenames = false,
        stages = ["pre-commit"]
    }
]
