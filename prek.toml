[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
    { id = "check-yaml" },
    { id = "end-of-file-fixer" },
    { id = "trailing-whitespace" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-yaml" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "cargo-fmt",
        name = "cargo fmt",
        language = "system",
        entry = "cargo fmt --",
        types = ["rust"],
        pass_filenames = false,
    },
]

[[repos]]
repo = "local"
hooks = [
    {
        id = "check-todo",
        name = "Check for TODO comments",
        entry = "grep -rnEI 'TODO:'",
        language = "system",
        stages = ["pre-commit"]
    }
]
