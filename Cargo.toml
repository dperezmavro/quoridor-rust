[package]
name = "quoridor-rust"
authors = ["dionisio perez mavrogenis"]
version = "0.0.0"
edition = "2024"
description = "A game that I use to learn Rust!"


[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[dependencies]
macroquad = "0.4.16"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.154"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
