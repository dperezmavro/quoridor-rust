[package]
name = "quoridor-rust"
authors = ["dionisio perez mavrogenis"]
version = "0.0.0"
edition = "2024"
description = "A game that I use to learn Rust!"

[dependencies]
macroquad = "0.4.16"
tokio = { version="1.53.2" , features = ["macros", "rt-multi-thread"]}


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true
